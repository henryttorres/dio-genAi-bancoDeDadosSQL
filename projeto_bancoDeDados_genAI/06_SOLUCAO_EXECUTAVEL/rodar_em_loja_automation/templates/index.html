<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rodar em Loja | Automação</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><div><small>DX • CAPACIDADE OPERACIONAL</small><h1>Central Rodar em Loja</h1><p>Ingestão CSV, regras de elegibilidade e visualização local.</p></div><span id="state">Carregando...</span></header>
<section class="bar"><input id="url" placeholder="URL CSV publicada pelo Google Sheets"><button onclick="syncSheet()">Sincronizar URL</button><input id="file" type="file" accept=".csv"><button onclick="upload()">Importar CSV</button><a href="/api/export">Exportar base</a></section>
<section class="kpis"><article><label>Solicitadas</label><b id="k1">0</b></article><article><label>Reservadas</label><b id="k2">0</b></article><article><label>Livres</label><b id="k3">0</b></article><article><label>Elegíveis</label><b id="k4">0</b></article></section>
<section class="grid"><article class="card wide"><h2>Vagas livres por praça</h2><canvas id="chart"></canvas></article><article class="card"><h2>Decisão operacional</h2><div id="decision"></div></article></section>
<section class="card"><h2>Base consolidada</h2><div class="scroll"><table><thead><tr><th>Data</th><th>Praça</th><th>Loja</th><th>Turno</th><th>Solicitadas</th><th>Reservadas</th><th>Livres</th><th>Restante</th><th>Elegível</th><th>Canal</th></tr></thead><tbody id="body"></tbody></table></div></section>
</main><script>
let chart; const n=v=>Number(v||0); async function load(){const r=await fetch('/api/data');const d=await r.json();render(d);document.querySelector('#state').textContent=d.length+' registros carregados'}
function render(d){k1.textContent=d.reduce((a,x)=>a+n(x.vagas_solicitadas),0);k2.textContent=d.reduce((a,x)=>a+n(x.vagas_reservadas),0);k3.textContent=d.reduce((a,x)=>a+n(x.vagas_livres),0);k4.textContent=d.filter(x=>String(x.elegivel).toLowerCase()==='true').reduce((a,x)=>a+n(x.vagas_livres),0);body.innerHTML=d.map(x=>`<tr><td>${x.data||''}</td><td>${x.praca||''}</td><td>${x.loja||''}</td><td>${x.inicio_turno||''}-${x.fim_turno||''}</td><td>${x.vagas_solicitadas}</td><td>${x.vagas_reservadas}</td><td>${x.vagas_livres}</td><td>${x.minutos_restantes} min</td><td>${String(x.elegivel).toLowerCase()==='true'?'Sim':'Não'}</td><td>${x.canal_recomendado}</td></tr>`).join('');let g={};d.forEach(x=>g[x.praca]=(g[x.praca]||0)+n(x.vagas_livres));if(chart)chart.destroy();chart=new Chart(document.querySelector('#chart'),{type:'bar',data:{labels:Object.keys(g),datasets:[{label:'Vagas livres',data:Object.values(g),backgroundColor:'#ea1d2c'}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});fetch('/api/recommendation').then(r=>r.json()).then(x=>decision.innerHTML=`<strong>${x.status}</strong><p>${x.message||('Canal recomendado: '+x.channel+' para '+x.total_vagas+' vaga(s).')}</p>`)}
async function upload(){let f=file.files[0];if(!f)return alert('Escolha um CSV');let fd=new FormData();fd.append('file',f);let r=await fetch('/api/upload',{method:'POST',body:fd});let j=await r.json();if(!r.ok)return alert(j.error);load()}
async function syncSheet(){let r=await fetch('/api/sync-sheet',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url.value})});let j=await r.json();if(!r.ok)return alert(j.error);load()}load();
</script></body></html>
